<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Управление роборукой</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      color: #aaa;
      text-transform: uppercase;
    }

    #status-text {
      font-size: 1rem;
      margin-bottom: 40px;
      color: #555;
      transition: color 0.3s;
    }

    #status-text.on {
      color: #00e676;
    }

    #status-text.off {
      color: #ff1744;
    }

    /* Кнопка-круг */
    .power-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #333;
      background: #1a1a1a;
      cursor: pointer;
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }

    .power-btn::after {
      content: '';
      display: block;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid #333;
      border-top-color: transparent;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: border-color 0.3s;
    }

    /* Вертикальная черта символа питания */
    .power-btn::before {
      content: '';
      display: block;
      width: 4px;
      height: 30px;
      background: #333;
      position: absolute;
      top: calc(50% - 30px);
      left: calc(50% - 2px);
      transition: background 0.3s;
    }

    /* Состояние ON */
    .power-btn.on {
      border-color: #00e676;
      box-shadow: 0 0 30px #00e67688, 0 0 60px #00e67633;
    }

    .power-btn.on::after {
      border-color: #00e676;
      border-top-color: transparent;
    }

    .power-btn.on::before {
      background: #00e676;
    }

    /* Состояние OFF */
    .power-btn.off {
      border-color: #ff1744;
      box-shadow: 0 0 20px #ff174422;
    }

    .power-btn.off::after {
      border-color: #ff1744;
      border-top-color: transparent;
    }

    .power-btn.off::before {
      background: #ff1744;
    }

    /* Анимация нажатия */
    .power-btn:active {
      transform: scale(0.96);
    }

    #error-msg {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #ff1744;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Роборука — кнопка вкл/выкл</h1>
  <p id="status-text">Загрузка...</p>

  <button class="power-btn" id="btn" onclick="toggle()"></button>

  <p id="error-msg">Ошибка соединения с сервером</p>

  <script>
    // При загрузке страницы — запросить актуальное состояние с сервера
    window.onload = async function () {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        applyState(data.powered);
      } catch (e) {
        showError();
      }
    };

    // Нажатие кнопки — отправить POST на сервер, применить ответ
    async function toggle() {
      try {
        const res = await fetch('/api/toggle', { method: 'POST' });
        const data = await res.json();
        applyState(data.powered);
      } catch (e) {
        showError();
      }
    }

    // Применить состояние к UI
    function applyState(powered) {
      const btn = document.getElementById('btn');
      const status = document.getElementById('status-text');
      const err = document.getElementById('error-msg');

      err.style.display = 'none';

      if (powered) {
        btn.className = 'power-btn on';
        status.textContent = 'ВКЛЮЧЕНО';
        status.className = 'on';
      } else {
        btn.className = 'power-btn off';
        status.textContent = 'ВЫКЛЮЧЕНО';
        status.className = 'off';
      }
    }

    function showError() {
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>

</body>
</html>
