<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --card: #fdfaf4;
    --border: #ddd5c0;
    --text: #2a2318;
    --dim: #9e8f78;
    --ok: #15803d;
    --run: #b45309;
    --accent: #c2410c;
    --font: 'Space Mono', monospace;
  }

  body {
    background: var(--bg);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }

  .card {
    width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .header-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .header-id {
    font-size: 10px;
    color: var(--border);
    letter-spacing: 0.06em;
  }

  .body { padding: 24px 20px 20px; }

  .power-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .power-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--dim);
    font-family: var(--font);
    font-size: 10px;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .power-btn:hover { border-color: var(--accent); color: var(--accent); }
  .power-btn.active { border-color: var(--ok); color: var(--ok); background: #f0fdf4; }

  .power-state { text-align: right; }
  .power-state .s-label {
    display: block;
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .power-state .s-val { font-size: 13px; font-weight: 700; }

  .sep {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .sep-line { flex: 1; height: 1px; background: var(--border); }
  .sep-text { font-size: 9px; color: var(--border); letter-spacing: 0.14em; text-transform: uppercase; }

  .cmd-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
  .cmd-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--border);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: not-allowed;
    transition: all 0.15s;
    text-align: left;
  }
  .cmd-btn .arrow { font-size: 10px; display: inline-block; transition: transform 0.15s; }
  .cmd-btn:not(:disabled) { cursor: pointer; color: var(--text); }
  .cmd-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); background: #fff8f5; }
  .cmd-btn:not(:disabled):hover .arrow { transform: translateX(4px); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.idle  { background: var(--border); }
  .dot.ready { background: var(--ok); }
  .dot.run   { background: var(--run); animation: blink 0.5s ease-in-out infinite alternate; }
  .dot.done  { background: var(--ok); }
  .dot.off   { background: var(--accent); }
  @keyframes blink { to { opacity: 0.25; } }

  .st-text { flex: 1; }
  .st-time { font-size: 9px; color: var(--border); white-space: nowrap; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="header-label">control panel</span>
    <span class="header-id">v1.0 / local</span>
  </div>
  <div class="body">
    <div class="power-row">
      <button class="power-btn" id="powerBtn" onclick="togglePower()">ON</button>
      <div class="power-state">
        <span class="s-label">состояние</span>
        <span class="s-val" id="powerLabel">ОТКЛ</span>
      </div>
    </div>

    <div class="sep">
      <div class="sep-line"></div>
      <span class="sep-text">команды</span>
      <div class="sep-line"></div>
    </div>

    <div class="cmd-list">
      <button class="cmd-btn" id="cmd1" disabled onclick="runCmd(1)">Команда 1 <span class="arrow">→</span></button>
      <button class="cmd-btn" id="cmd2" disabled onclick="runCmd(2)">Команда 2 <span class="arrow">→</span></button>
      <button class="cmd-btn" id="cmd3" disabled onclick="runCmd(3)">Команда 3 <span class="arrow">→</span></button>
    </div>

    <div class="status-bar">
      <div class="dot idle" id="dot"></div>
      <span class="st-text" id="stText">ожидание</span>
      <span class="st-time" id="stTime">—</span>
    </div>
  </div>
</div>

<script>
  let powered = false, running = false;

  function ts() { return new Date().toLocaleTimeString('ru-RU', { hour12: false }); }

  function setStatus(text, cls) {
    document.getElementById('stText').textContent = text;
    document.getElementById('stTime').textContent = ts();
    document.getElementById('dot').className = 'dot ' + cls;
  }

  function togglePower() {
    if (running) return;
    powered = !powered;
    const btn = document.getElementById('powerBtn');
    const lbl = document.getElementById('powerLabel');
    const cmds = document.querySelectorAll('.cmd-btn');
    if (powered) {
      btn.classList.add('active'); btn.textContent = 'OFF';
      lbl.textContent = 'ВКЛ';
      cmds.forEach(b => b.disabled = false);
      setStatus('система готова к работе', 'ready');
    } else {
      btn.classList.remove('active'); btn.textContent = 'ON';
      lbl.textContent = 'ОТКЛ';
      cmds.forEach(b => b.disabled = true);
      setStatus('система выключена', 'off');
    }
  }

  function runCmd(n) {
    if (!powered || running) return;
    running = true;
    document.querySelectorAll('.cmd-btn').forEach(b => b.disabled = true);
    setStatus('выполняется команда ' + n + '...', 'run');
    setTimeout(() => {
      setStatus('команда ' + n + ' выполнена', 'done');
      running = false;
      if (powered) document.querySelectorAll('.cmd-btn').forEach(b => b.disabled = false);
    }, 700);
  }
</script>
</body>
</html>
